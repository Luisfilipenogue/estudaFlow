<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}EstudaFlow{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:       #080B12;
      --surface:  #111520;
      --surface2: #181D2E;
      --border:   #222840;
      --accent:   #7C6FFF;
      --accent2:  #A78BFA;
      --green:    #22D3A0;
      --yellow:   #FBBF24;
      --red:      #F87171;
      --text:     #E2E8F0;
      --muted:    #64748B;
      --font:     'Syne', sans-serif;
      --mono:     'JetBrains Mono', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 220px;
      min-height: 100vh;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 32px 0;
      position: fixed;
      top: 0; left: 0;
      z-index: 100;
    }
    .sidebar-logo {
      padding: 0 24px 32px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-logo h1 {
      font-size: 20px;
      font-weight: 800;
      color: var(--accent2);
      letter-spacing: -0.5px;
    }
    .sidebar-logo span {
      font-size: 11px;
      color: var(--muted);
      font-family: var(--mono);
    }
    .nav { padding: 24px 12px; flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .nav a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 10px;
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.15s;
    }
    .nav a:hover { background: var(--surface2); color: var(--text); }
    .nav a.active { background: var(--accent); color: #fff; }
    .nav a .icon { font-size: 16px; }

    /* ── Main ── */
    .main {
      margin-left: 220px;
      flex: 1;
      padding: 40px 48px;
      max-width: calc(100vw - 220px);
    }
    .page-header { margin-bottom: 32px; }
    .page-header h2 { font-size: 28px; font-weight: 800; }
    .page-header p { color: var(--muted); font-size: 14px; margin-top: 4px; font-family: var(--mono); }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
    }
    .card-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 16px;
      font-family: var(--mono);
    }

    /* ── Stats row ── */
    .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 24px;
    }
    .stat-value { font-size: 36px; font-weight: 800; }
    .stat-label { font-size: 12px; color: var(--muted); font-family: var(--mono); margin-top: 4px; }

    /* ── Form ── */
    .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin-bottom: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; font-family: var(--mono); }
    .form-group input,
    .form-group select {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      padding: 10px 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    .form-group input:focus,
    .form-group select:focus { border-color: var(--accent); }
    .form-group select option { background: var(--surface2); }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      border-radius: 8px;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent2); }
    .btn-danger { background: transparent; color: var(--red); border: 1px solid var(--red); }
    .btn-danger:hover { background: var(--red); color: #fff; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { color: var(--text); border-color: var(--text); }
    .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 6px; }

    /* ── Table ── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      text-align: left;
      padding: 12px 16px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      font-family: var(--mono);
    }
    td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface2); }

    /* ── Badges ── */
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 700;
      font-family: var(--mono);
    }
    .badge-alta    { background: rgba(248,113,113,.15); color: var(--red); }
    .badge-media   { background: rgba(251,191,36,.15);  color: var(--yellow); }
    .badge-baixa   { background: rgba(34,211,160,.15);  color: var(--green); }
    .badge-done    { background: rgba(34,211,160,.15);  color: var(--green); }
    .badge-pending { background: rgba(100,116,139,.15); color: var(--muted); }
    .badge-holiday { background: rgba(124,111,255,.2);  color: var(--accent2); }
    .badge-overdue { background: rgba(248,113,113,.15); color: var(--red); }

    /* ── Holiday strip ── */
    .holiday-strip {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .holiday-pill {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 12px;
      font-family: var(--mono);
    }
    .holiday-pill .hdate { color: var(--accent2); font-weight: 700; }
    .holiday-pill .hname { color: var(--muted); margin-top: 2px; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 24px; right: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 20px;
      font-size: 13px;
      font-family: var(--mono);
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 999;
    }
    #toast.show { opacity: 1; }

    .text-done { text-decoration: line-through; color: var(--muted); }
    .mt-16 { margin-top: 16px; }
    .mt-24 { margin-top: 24px; }
    .gap-8 { display: flex; gap: 8px; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo">
      <h1>EstudaFlow</h1>
      <span>v1.1.0</span>
    </div>
    <nav class="nav">
      <a href="/" class="{% if request.path == '/' %}active{% endif %}">
        <span class="icon">◈</span> Dashboard
      </a>
      <a href="/tarefas" class="{% if request.path == '/tarefas' %}active{% endif %}">
        <span class="icon">◻</span> Tarefas
      </a>
      <a href="/disciplinas" class="{% if request.path == '/disciplinas' %}active{% endif %}">
        <span class="icon">◑</span> Disciplinas
      </a>
      <a href="/feriados" class="{% if request.path == '/feriados' %}active{% endif %}">
        <span class="icon">◇</span> Feriados BR
      </a>
    </nav>
  </aside>

  <main class="main">
    {% block content %}{% endblock %}
  </main>

  <div id="toast"></div>

  <script>
    function showToast(msg, color) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.color = color || '#E2E8F0';
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2800);
    }

    async function api(method, url, body) {
      const opts = { method, headers: { 'Content-Type': 'application/json' } };
      if (body) opts.body = JSON.stringify(body);
      const res = await fetch(url, opts);
      return res.json();
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
